<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xGearbox &ndash; Download the App</title>
<style>
  :root {
    --primary: #1B3B6F;
    --primary-dark: #122A50;
    --accent: #FF7A00;
    --accent-dark: #E06900;
    --link-blue: #1A73E8;
    --background: #F5F6F8;
    --surface: #FFFFFF;
    --text-primary: #1C1C1E;
    --text-secondary: #4C4A4A;
    --divider: #E0E0E0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--background);
    color: var(--text-primary);
  }

  header {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 48px 20px 64px;
    text-align: center;
  }

  header .logo-badge {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    background: #fff;
    padding: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    margin-bottom: 18px;
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  header p.tagline {
    margin: 0;
    font-size: 15px;
    color: #CBD7EA;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  main {
    max-width: 480px;
    margin: -40px auto 40px;
    padding: 0 20px;
  }

  .card {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(27, 59, 111, 0.12);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .download-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 20px;
    border-radius: 12px;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .download-btn:hover { background: var(--accent-dark); }
  .download-btn:active { transform: scale(0.98); }

  .download-btn svg { flex-shrink: 0; }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }
  .meta-row:last-child { border-bottom: none; }
  .meta-row .label { color: var(--text-secondary); }
  .meta-row .value { font-weight: 600; color: var(--text-primary); }

  .badge {
    display: inline-block;
    background: #EAF0FB;
    color: var(--primary);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 10px;
  }

  h2.section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 14px;
  }

  ol.steps {
    margin: 0;
    padding-left: 20px;
    color: var(--text-secondary);
    font-size: 14.5px;
    line-height: 1.6;
  }

  ol.steps li { margin-bottom: 10px; }
  ol.steps li:last-child { margin-bottom: 0; }
  ol.steps strong { color: var(--text-primary); }

  .note {
    display: flex;
    gap: 10px;
    background: #FFF4EA;
    border: 1px solid #FFD9B3;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: #7A4600;
    margin-top: 16px;
  }

  footer {
    text-align: center;
    font-size: 12.5px;
    color: var(--text-secondary);
    padding: 0 20px 40px;
  }

  footer a { color: var(--link-blue); text-decoration: none; font-weight: 600; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <img class="logo-badge" src="https://raw.githubusercontent.com/center53/xGearbox/refs/heads/main/ic_xlauch_og.png" alt="xGearbox logo">
  <h1>xGearbox</h1>
  <p class="tagline">Track Vehicle Maintenance</p>
</header>

<main>
  <div class="card">
 
    <a class="download-btn" href="https://github.com/center53/xGearbox/raw/refs/heads/main/app-release.apk" download>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 3V15M12 15L7 10M12 15L17 10" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 18V19C4 20.1046 4.89543 21 6 21H18C19.1046 21 20 20.1046 20 19V18" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Download APK
    </a>



  <div class="card">
    <h2 class="section-title">How to Install</h2>
    <ol class="steps">
      <li>Tap <strong>Download APK</strong> button to download the installation.</li>
      <li>If prompted, tap <strong>Settings</strong> and allow your browser to <strong>install unknown apps</strong>.</li>
      <li>Tap <strong>Install</strong>, then <strong>Open</strong> to launch xGearbox and create your account.</li>
    </ol>
 
  </div>
</main>


</body>
</html>
